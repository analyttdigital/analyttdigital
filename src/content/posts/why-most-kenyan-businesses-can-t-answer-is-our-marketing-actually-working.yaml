title: Why Most Kenyan Businesses Can’t Answer “Is Our Marketing Actually Working?”
slug: Why Most Kenyan Businesses Can’t Answer “Is Our Marketing Actually Working?”
excerpt: >-
  Ask ten business owners in Nairobi whether their marketing is working, and
  most will answer with a feeling, not a number. “Ads seem to be doing okay.”
  “We’ve noticed more traffic.” “Sales have been decent this quarter.” Almost
  none of them can tell you, with any confidence, which specific channel,
  campaign, or shilling of spend actually produced their last ten sales.


  That’s not a knowledge gap on the part of business owners. It’s an
  infrastructure gap and it’s arguably the single biggest performance marketing
  challenge facing businesses in Kenya today: marketing attribution, or the
  ability to trace a sale back to the specific channel that caused it.
