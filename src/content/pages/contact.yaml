      cta: Book a free audit
      ctaHref: /digital-audit/
  - discriminant: faq
    value:
      eyebrow: FAQ
      headline: Questions, answered.
      body: Fast answers before you reach out.
      items:
        - question: Do you work with businesses outside Kenya?
          answer: Yes, we work across East Africa and with international brands entering African markets.
        - question: How quickly do you respond?
          answer: Within a few hours on business days. WhatsApp is fastest.
        - question: Do you charge for the initial consultation?
          answer: No. The 30-minute digital audit is completely free, with no obligation.
        - question: What information should I have ready?
          answer: 'Ideally: your website, current marketing channels, monthly budget range, and your main growth goal.'
