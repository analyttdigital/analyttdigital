  - discriminant: faq
    value:
      eyebrow: FAQ
      headline: Questions, answered.
      body: Scope, timing, contracts, and cost.
      items:
        - question: Do you work with businesses outside Kenya?
          answer: Yes. We work across Kenya, Uganda, Tanzania, Rwanda, and the wider East African region, as well as international businesses entering African markets.
        - question: Can I buy just one service?
          answer: Absolutely. Many clients start with a single engagement, often Paid Media or Data and Analytics, then expand as results compound.
        - question: How quickly will I see results?
          answer: Paid media and CRO typically show measurable movement within 30-90 days. SEO compounds over 6-12 months. Strategy engagements deliver value immediately through better budget allocation.
        - question: Do you require long contracts?
          answer: We recommend a 90-day initial engagement to gather data and prove the model, then move to rolling monthly terms.
        - question: How much do your services cost?
          answer: Pricing depends on scope. See our pricing plans for tiered options, or book an audit for a custom quote.
  - discriminant: cta-split
    value:
      eyebrow: Not sure where to start?
      headline: Get a free 30-minute performance audit.
      body: We'll analyse your current marketing wherever you operate across Kenya and East Africa, and tell you exactly where your biggest growth opportunities are. No pitch. No obligation. Just data.
      cta: Request Your Free Audit
      ctaHref: /digital-audit/
      note: Most businesses need one or two services to unlock the next stage.
      portalLabel: Free · No commitment
