  - discriminant: problem-alt
    value:
      eyebrow: The Problem
      headline: The spend was never the problem.
      paragraphs:
        - 'Kenyan businesses already know they should be on Google, Meta and TikTok; the budgets are there. What is scarce is the read: which channels deserve money, which funnels leak, and what each shilling actually returns.'
        - Most reports stop at reach and impressions. The decision of where the next shilling goes is made on gut feel. That gap between reporting and revenue is where growth stalls.
      closing: Analytt exists to close that gap.
      panelTitle: Account snapshot
