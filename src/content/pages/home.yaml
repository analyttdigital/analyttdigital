  - discriminant: work
    value:
      eyebrow: Selected Work
      headline: Proof, not promises.
      body: 'Engagements measured to the shilling: the proof behind the promises.'
      cta: ''
      ctaHref: ''
      cases:
        - client: Mandevu BeardCare
          image:
            src: /media/uploads/home/work-cases-0-image.png
            alt: Mandevu BeardCare
          industry: Retail · Nairobi
          depth: Case 01
          headline: From KES 80K/mo in losses to KES 2.4M in monthly revenue.
          body: A Nairobi retailer spending KES 200K/month on Meta Ads with zero attribution and a 1.1x ROAS. We rebuilt tracking, restructured the account and launched Kenya-specific creative. Profitable within 90 days.
          metric: 2.4M
          metricLabel: KES monthly revenue within 90 days
        - client: ZoomTech Ke
          image:
            src: /media/uploads/home/work-cases-1-image.png
            alt: ZoomTech Ke
          industry: Technology
          depth: Case 02
          headline: 1,200+ qualified leads per month at KES 280 CPL.
          body: A tech company paying over KES 1,800 per unqualified lead through Google Search. New keyword structure, intent-segmented landing pages and lead scoring. CPL down 84% in 60 days.
          metric: '-84%'
          metricLabel: cost per lead in 60 days
        - client: Kings Bliss Developers
          image:
            src: /media/uploads/home/work-cases-2-image.png
            alt: Kings Bliss Developers
          industry: Real Estate
          depth: Case 03
          headline: 37 property inquiries per week from a KES 150K budget.
          body: A developer generating 3–4 leads a week from boosted posts. Full-funnel campaign with virtual tours, retargeting and WhatsApp follow-up. Inquiries up 9x.
          metric: 9×
          metricLabel: growth in weekly inquiries
        - client: Mabati Yetu
          image:
            src: /media/uploads/home/work-cases-3-image.png
            alt: Mabati Yetu
          industry: Logistics
          depth: Case 04
          headline: Page 1 rankings for 47 high-intent keywords in 8 months.
          body: A logistics company with zero organic presence. Kenyan-search content strategy, technical SEO foundation and product landing pages. Organic became the highest-converting channel.
          metric: '47'
          metricLabel: page-1 keywords in 8 months
