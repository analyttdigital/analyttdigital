      items:
        - Startups entering Kenya or East Africa for the first time
        - Established businesses expanding into new regional markets
        - Funded companies who need to deploy budget with a clear plan
        - Founders and CMOs who need a data-driven second opinion on strategy
        - International brands localising for African consumers
  - discriminant: process-alt
    value:
      eyebrow: Our process
      headline: Discovery to refinement,
