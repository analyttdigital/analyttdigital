        - title: Abandoned Cart Recovery
          tag: Scope 03
          depth: '03'
          icon: tag
          body: Multi-step sequences that recover 15–25% of abandoned carts.
        - title: Lead Nurture Sequences
          tag: Scope 04
          depth: '04'
