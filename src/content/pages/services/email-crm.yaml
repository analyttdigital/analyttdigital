description: Welcome flows, abandoned cart recovery, lead nurture and retention marketing for Kenyan and East African businesses. 3.1x customer LTV.
featuredImage:
  alt: ''
sections:
  - discriminant: page-hero-alt
    value:
      eyebrow: Email and CRM
      headline: Turn leads into loyal, repeat customers.
      lede: Acquiring a new customer costs 5-7x more than retaining one. Yet most businesses spend 90% of budget on acquisition, and almost nothing on customers already won.
      quote: Your email list is the only audience you actually own.
      cta: Request Your Free Audit
      ctaHref: /contact/
      secondaryCta: ''
      secondaryCtaHref: ''
  - discriminant: problem-alt
    value:
      eyebrow: The problem we solve
      headline: Is your list earning its keep?
      paragraphs:
        - Do you have a welcome sequence that converts new subscribers?
        - Are you recovering abandoned carts (15–25% of them are recoverable)?
        - Is your email list engaged, or slowly dying from neglect?
        - Do you know the revenue each email flow generates?
        - Are you treating every subscriber the same, or segmenting by behaviour?
      closing: If you're only sending the occasional newsletter, you're leaving substantial revenue on the table.
